# Nightly encrypted backup of every Quemo D1 database.
# Lives in the PRIVATE backup repo (installed by `npm run backup:setup` from the quemo repo).
# Secrets: CLOUDFLARE_API_TOKEN (Account > D1 > Edit), CLOUDFLARE_ACCOUNT_ID, AGE_RECIPIENT (public key).
name: backup
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Export, compress and encrypt
        run: |
          set -euo pipefail
          : "${AGE_RECIPIENT:?missing AGE_RECIPIENT secret}"
          mkdir -p plain snapshots
          : > MANIFEST.new
          for db in quemo-auth quemo-budget quemo-workout quemo-health quemo-food; do
            npx -y wrangler@4 d1 export "$db" --remote --output "plain/$db.sql" -y
            test -s "plain/$db.sql"
            rows=$(grep -c '^INSERT' "plain/$db.sql" || true)
            sum=$(sha256sum "plain/$db.sql" | cut -c1-64)
            echo "$db rows=$rows sha256=$sum" >> MANIFEST.new
            gzip -9 -n -c "plain/$db.sql" | age -r "$AGE_RECIPIENT" -o "snapshots/$db.sql.gz.age"
          done
          rm -rf plain
          cat MANIFEST.new
      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if [ -f MANIFEST.txt ] && cmp -s MANIFEST.new MANIFEST.txt; then
            echo "No data changes since the last backup; skipping commit."
            exit 0
          fi
          mv MANIFEST.new MANIFEST.txt
          git config user.name "quemo-backup"
          git config user.email "quemo-backup@users.noreply.github.com"
          git add snapshots MANIFEST.txt
          git commit -m "backup $(date -u +%F)"
          git push
